version: '3.8'

x-runtime: &runtime
  restart_policy:
    condition: any
    delay: 15s
  placement:
    constraints: [node.role == manager]
  update_config:
    order: stop-first
    failure_action: rollback

services:
  app:
    image: ${POSTIZ_IMAGE}
    environment:
      MAIN_URL: https://${POSTIZ_DOMAIN}
      FRONTEND_URL: https://${POSTIZ_DOMAIN}
      NEXT_PUBLIC_BACKEND_URL: https://${POSTIZ_DOMAIN}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      DATABASE_URL: postgresql://postiz:${POSTGRES_PASSWORD}@postgres:5432/postiz
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'true'
      RUN_CRON: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      TZ: America/Sao_Paulo
      NX_ADD_PLUGINS: 'false'
      API_LIMIT: '30'
    volumes:
      - ${POSTIZ_ROOT}/data/config:/config
      - ${POSTIZ_ROOT}/data/uploads:/uploads
    networks: [backend, traefik-proxy]
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:5000/api/auth/can-register',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    deploy:
      <<: *runtime
      resources:
        limits: {memory: 3G, cpus: '1.5'}
      labels:
        traefik.enable: ${POSTIZ_PUBLIC_ENABLED}
        traefik.swarm.network: traefik-proxy
        traefik.http.routers.postiz.rule: Host(`${POSTIZ_DOMAIN}`)
        traefik.http.routers.postiz.entrypoints: websecure
        traefik.http.routers.postiz.tls: 'true'
        traefik.http.routers.postiz.tls.certresolver: letsencrypt
        traefik.http.routers.postiz.service: postiz
        traefik.http.services.postiz.loadbalancer.server.port: '5000'

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postiz
    volumes:
      - ${POSTIZ_ROOT}/data/postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postiz -d postiz']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *runtime
      resources:
        limits: {memory: 512M, cpus: '0.5'}

  redis:
    image: redis:7.2
    command: [redis-server, --appendonly, 'yes', --maxmemory, 192mb, --maxmemory-policy, noeviction]
    volumes:
      - ${POSTIZ_ROOT}/data/redis:/data
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *runtime
      resources:
        limits: {memory: 256M, cpus: '0.25'}

  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD}
    volumes:
      - ${POSTIZ_ROOT}/data/temporal-postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U temporal']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *runtime
      resources:
        limits: {memory: 512M, cpus: '0.5'}

  elasticsearch:
    image: elasticsearch:7.17.27
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms256m -Xmx256m
      xpack.security.enabled: 'false'
    volumes:
      - ${POSTIZ_ROOT}/data/elasticsearch:/usr/share/elasticsearch/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1']
      interval: 20s
      timeout: 10s
      start_period: 90s
      retries: 10
    deploy:
      <<: *runtime
      resources:
        limits: {memory: 768M, cpus: '0.5'}

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
      ENABLE_ES: 'true'
      ES_SEEDS: elasticsearch
      ES_VERSION: v7
      TEMPORAL_NAMESPACE: default
    configs:
      - source: temporal-dynamic
        target: /etc/temporal/config/dynamicconfig/production-sql.yaml
    networks: [backend]
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, 'temporal:7233']
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 10
    deploy:
      <<: *runtime
      resources:
        limits: {memory: 1G, cpus: '0.75'}

configs:
  temporal-dynamic:
    file: ./temporal-dynamic.yml

networks:
  backend:
    driver: overlay
    attachable: true
  traefik-proxy:
    external: true
